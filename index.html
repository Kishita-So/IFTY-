<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語帳アプリ</title>
</head>
<body style="font-family: sans-serif; background: #0f172a; margin: 0; padding: 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">

  <div id="landingPage" style="background: #1e293b; color: white; padding: 32px 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left;">
    <div style="font-size: 2em; font-weight: bold; margin-bottom: 8px; color: #38bdf8;">単語帳</div>
    <h2 style="margin: 0 0 24px 0; font-size: 1.4em; font-weight: normal; color: #f1f5f9;">アカウントを選択してください</h2>

    <div id="accountList" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;"></div>

    <div onclick="showAuthModal('login')" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid #334155; cursor: pointer; border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='#334155'" onmouseout="this.style.background='transparent'">
      <div style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #64748b; display: flex; align-items: center; justify-content: center; font-size: 1.2em;">👤</div>
      <span style="font-size: 0.95em; color: #cbd5e1;">別のアカウントを使用</span>
    </div>
  </div>

  <div id="mainPortal" style="display: none; width: 100%; max-width: 650px; margin: 0 auto; background: #f8fafc; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: white; padding: 12px 16px; border-radius: 8px; border: 1px solid #e2e8f0;">
      <div>
        <span style="font-size:0.8em; color:#64748b;">ログイン中:</span><br>
        <b id="userDisplay" style="color: #0f172a;"></b>
      </div>
      <div style="display: flex; gap: 6px;">
        <button onclick="showAccountSettings()" style="background: #475569; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em;">⚙️ アカウント設定</button>
        <button onclick="logout()" style="background: #e11d48; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em;">ログアウト</button>
      </div>
    </div>

    <div id="accountModal" style="display:none; background: #f1f5f9; padding: 14px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 20px;">
      <h3 style="margin: 0 0 10px 0; font-size: 1em; color: #334155;">⚙️ アカウント設定・データ移行</h3>
      <div style="margin-bottom: 12px; background: white; padding: 10px; border-radius: 6px;">
        <label style="font-size:0.85em; font-weight:bold; color:#475569;">📧 ログインアドレス（データ）の移動</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input id="newEmailInput" placeholder="新しいメールアドレスを入力" style="flex:1; padding:6px; font-size:0.85em; border:1px solid #cbd5e1; border-radius:4px;">
          <button onclick="transferAccountData()" style="background:#0284c7; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:0.85em; cursor:pointer;">移行する</button>
        </div>
      </div>
      <div style="background: white; padding: 10px; border-radius: 6px;">
        <label style="font-size:0.85em; font-weight:bold; color:#475569;">🔑 パスワードの変更</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input id="changePassInput" type="password" placeholder="新しいパスワードを入力" style="flex:1; padding:6px; font-size:0.85em; border:1px solid #cbd5e1; border-radius:4px;">
          <button onclick="changePassword()" style="background:#15803d; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:0.85em; cursor:pointer;">変更</button>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
      <input id="folderName" placeholder="新しいフォルダ名を入力してEnter" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
      <button id="createFolderBtn" onclick="createFolder()" style="background: #15803d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">フォルダ作成</button>
    </div>

    <div id="folders"></div>
  </div>

  <div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; padding:24px; border-radius:12px; width:300px; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
      <h2 id="modalTitle" style="margin-top:0; color:#0f172a;">ログイン</h2>
      <input id="authEmail" type="text" placeholder="メールアドレス" style="width:100%; padding:8px; margin-bottom:8px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:4px;">
      
      <div style="position:relative; width:100%; margin-bottom:12px;">
        <input id="authPassword" type="password" placeholder="パスワード" style="width:100%; padding:8px 36px 8px 8px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:4px;">
        <button id="togglePassBtn" onclick="togglePassword()" type="button" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1em;">👁️</button>
      </div>
      
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button id="authSubmitBtn" onclick="handleAuthSubmit()" style="background:#15803d; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold;">決定</button>
        <button onclick="hideAuthModal()" style="background:#64748b; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;">閉じる</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
