<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語帳アプリ</title>
</head>
<body style="font-family: sans-serif; background: #f8fafc; margin: 0; padding: 16px;">

  <div id="landingPage" style="text-align: center; margin-top: 40px;">
    <h1>英単語帳アプリ</h1>
    <button onclick="showAuthModal('login')" style="padding: 10px 20px; font-size: 1em; background: #15803d; color: white; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px;">ログイン</button>
    <button onclick="showAuthModal('register')" style="padding: 10px 20px; font-size: 1em; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer;">新規登録</button>
  </div>

  <div id="mainPortal" style="display: none; max-width: 600px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <span id="userDisplay" style="font-weight: bold; color: #334155;"></span>
      <button onclick="logout()" style="background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">ログアウト</button>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
      <input id="folderName" placeholder="新しいフォルダ名" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
      <button id="createFolderBtn" onclick="createFolder()" style="background: #15803d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">フォルダ作成</button>
    </div>

    <div id="folders"></div>
  </div>

  <div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; padding:24px; border-radius:8px; width:300px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
      <h2 id="modalTitle" style="margin-top:0;">ログイン</h2>
      <p id="authGuide" style="display:none; font-size:0.8em; color:#e11d48; margin-bottom:8px;"></p>

      <input id="authEmail" type="email" placeholder="メールアドレス" style="width:100%; padding:8px; margin-bottom:8px; box-sizing:border-box;">
      
      <div style="position:relative; width:100%; margin-bottom:12px;">
        <input id="authPassword" type="password" placeholder="パスワード" style="width:100%; padding:8px 36px 8px 8px; box-sizing:border-box;">
        <button id="togglePassBtn" onclick="togglePassword()" type="button" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1em; padding:0;">👁️</button>
      </div>
      
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button id="authSubmitBtn" onclick="handleAuthSubmit()" style="background:#15803d; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">ログイン</button>
        <button onclick="hideAuthModal()" style="background:#64748b; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;">閉じる</button>
      </div>

      <button id="resetPassBtn" onclick="handleResetPassword()" style="display:block; background:none; border:none; color:#0284c7; font-size:0.8em; margin-top:12px; cursor:pointer; padding:0;">🔑 パスワードをお忘れの際はこちら</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
